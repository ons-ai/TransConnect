<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TransConnect{% endblock %}</title>
  <style>
    body { max-width: 980px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; color: #17212b; }
    nav { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #ccd3da; }
    a { color: #0758a5; } main { padding: 1rem 0; }
    li { margin: .6rem 0; } form p { margin: .8rem 0; }
    input, select, textarea { max-width: 100%; } .actions { display: flex; gap: .8rem; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{% url 'expeditions:liste' %}">TransConnect</a></h1>
    <nav aria-label="Navigation principale">
      <a href="{% url 'expeditions:liste' %}">Expéditions</a>
      <a href="{% url 'vehicules:liste' %}">Véhicules</a>
      <a href="{% url 'offres:liste' %}">Offres</a>
      <a href="{% url 'entreprises:liste' %}">Entreprises</a>
      <a href="/admin/">Administration</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
