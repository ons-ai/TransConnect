{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Modifier{% else %}Créer{% endif %} — TransConnect{% endblock %}
{% block content %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

  </form>
{% endblock %}
